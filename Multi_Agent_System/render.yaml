services:
  - type: web
    name: collaborai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_RATE_LIMIT_RPM
        value: "12"
      - key: SIMULATION_MODE
        value: "false"
      - key: ENVIRONMENT
        value: "production"
